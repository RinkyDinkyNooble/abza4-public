	    ["minecraft:ocean", 12, 24, "C"],
	    ["minecraft:deep_ocean", 12, 24, "C"],
	    ["minecraft:snowy_plains", -2, 4, "C"],
	    ["minecraft:snowy_beach", -1, 4, "C"],
	    ["minecraft:snowy_slopes", -2, 3, "C"],
	    ["minecraft:grove", -2, 3, "C"],
	    ["minecraft:frozen_peaks", -3, 2, "C"],
	    ["minecraft:jagged_peaks", -3, 2, "C"],
	    ["minecraft:frozen_river", -2, 3, "C"],
	    ["minecraft:cold_ocean", -2, 3, "C"],
	    ["minecraft:deep_cold_ocean", -2, 3, "C"],
	    ["minecraft:badlands", 34, 50, "C"],
	    ["minecraft:desert", 32, 50, "C"],
	    ["minecraft:warm_ocean", 30, 44, "C"],
	    ["minecraft:deep_lukewarm_ocean", 28, 40, "C"],
	    ["ad_astra:lunar_wastelands", -17, 49, "C"],
	    ["abza:ash_wastes", 63, 65, "C"],
	    ["abza:eye_lands", 62, 64, "C"],
	    ["abza:overgrowth", 22, 36, "C"],
	    ["abza:ochre_highlands", 24, 37, "C"],
	    ["abza:frozen_wastes", -33, -31, "C"],
	    ["abza:the_bloom", -32, -30, "C"],
